services:
  keycloak-certificats:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: keycloak-dmgm-v2
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: true
    ports:
      - "8280:8080"
    command: start-dev
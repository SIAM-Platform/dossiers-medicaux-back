# Contrôle de chaque demande de fusion : vérification des types, tests unitaires, build.
# Contrôle exigé par la protection de la branche main (docs/pratiques-developpement.md).
# Contrôles de sécurité (analyse statique, dépendances, SBOM, secrets) : workflow securite.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Vérification des types
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests unitaires
        run: npm test -- --ci
      - name: Build
        run: npm run build
